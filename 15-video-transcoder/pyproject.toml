[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcoder"
version = "0.1.0"
description = "An asyncio video transcoder job queue built with FastAPI and FFmpeg (HLS output, WebSocket progress, thumbnails)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
keywords = ["ffmpeg", "fastapi", "transcoder", "hls", "asyncio", "websocket"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "jinja2>=3.1",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "websockets>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio",
]

[project.scripts]
transcoder = "transcoder.cli:cli"

[tool.setuptools.packages.find]
include = ["transcoder", "transcoder.*"]

[tool.setuptools.package-data]
transcoder = ["templates/*.html", "static/*"]