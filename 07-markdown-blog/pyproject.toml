[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-blog"
version = "1.0.0"
description = "A tiny static Markdown blog generator with RSS, Atom, sitemap and OG images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Author" }]
keywords = ["blog", "static-site-generator", "markdown", "rss", "sitemap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Text Processing :: Markup",
]

# Pin the exact extras so the console script keeps working when the real
# libraries are absent.  The generator is fully functional without any of
# these; the libraries only upgrade rendering quality.
dependencies = []

[project.optional-dependencies]
full = [
    "markdown-it-py>=2.0",
    "Jinja2>=3.0",
    "Pygments>=2.10",
    "Pillow>=9.0",
    "click>=8.0",
]
test = ["pytest>=7.0"]

[project.scripts]
blog = "blog.cli:main"

[tool.setuptools]
packages = ["blog"]

[tool.setuptools.package-data]
blog = [
    "templates/*.html",
    "templates/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]