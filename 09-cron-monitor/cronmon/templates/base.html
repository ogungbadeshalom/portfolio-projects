<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cron Monitor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.umd.min.js" defer></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">🛡️ Cron Monitor</a></div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/api/dashboard" data-test="api-link">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>status badges auto-refresh every 15s</span>
    <span id="clock" data-test="clock"></span>
  </footer>
  <script>document.getElementById('clock').textContent = new Date().toLocaleString();</script>
</body>
</html>
